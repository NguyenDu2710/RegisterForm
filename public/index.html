<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đặt xe thực hành</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f6fb; --card: #fff; --text: #1d2939; --muted: #667085; --line: #e4e7ec;
    --primary: #1f6feb; --primary-soft: #e8f0fe; --ok: #12b76a; --ok-soft: #e7f8ef;
    --bad: #f04438; --bad-soft: #fef0ef; --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: radial-gradient(1200px 500px at 50% -200px, #cfe0ff 0%, var(--bg) 70%);
    padding: 32px 16px 48px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 24px; }
  header .logo { width: 56px; height: 56px; border-radius: 16px; background: var(--primary); color: #fff;
    display: inline-grid; place-items: center; font-size: 28px; box-shadow: 0 8px 20px rgba(31,111,235,.3); }
  header h1 { margin: 12px 0 4px; font-size: 26px; letter-spacing: .3px; }
  header p { margin: 0; color: var(--muted); }
  .card { background: var(--card); border-radius: var(--radius); padding: 24px;
    box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 12px 32px rgba(16,24,40,.06); border: 1px solid var(--line); }
  .card + .card { margin-top: 16px; }
  h2 { margin: 0 0 4px; font-size: 19px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }

  .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .role { border: 2px solid var(--line); border-radius: 14px; padding: 22px 16px; background: #fff; cursor: pointer;
    text-align: center; transition: .15s; font: inherit; color: inherit; }
  .role:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 8px 18px rgba(31,111,235,.12); }
  .role .ic { font-size: 34px; }
  .role b { display: block; margin-top: 8px; font-size: 17px; }
  .role span { color: var(--muted); font-size: 13px; }

  label.f { display: block; font-weight: 600; margin: 18px 0 8px; font-size: 14px; }
  label.f .req { color: var(--bad); }
  input[type=text], input[type=password], input[type=date] {
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; font: inherit; font-size: 15px;
    background: #fff; color: var(--text); transition: .15s; }
  input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 10px;
    border: 0; font: inherit; font-weight: 600; cursor: pointer; background: var(--primary); color: #fff; transition: .15s; }
  .btn:hover { filter: brightness(1.07); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--line); }
  .btn.ghost:hover { color: var(--text); border-color: #cfd4dc; }
  .btn.block { width: 100%; margin-top: 22px; padding: 14px; font-size: 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .spacer { flex: 1; }

  .date-banner { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 12px;
    background: var(--primary-soft); color: #174ea6; }
  .date-banner .big { font-size: 20px; font-weight: 700; }
  .date-banner small { display: block; opacity: .8; }

  .opts { display: grid; gap: 10px; }
  .opts.c3 { grid-template-columns: repeat(3, 1fr); }
  .opts.c5 { grid-template-columns: repeat(5, 1fr); }
  .opt { position: relative; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt span { display: block; text-align: center; padding: 12px 6px; border: 1.5px solid var(--line); border-radius: 10px;
    cursor: pointer; font-weight: 600; transition: .12s; background: #fff; }
  .opt span small { display: block; font-weight: 500; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .opt input:checked + span { border-color: var(--primary); background: var(--primary-soft); color: #174ea6; }
  .opt input:focus-visible + span { box-shadow: 0 0 0 4px var(--primary-soft); }
  .opt input:disabled + span { cursor: not-allowed; background: #f8f9fb; color: #98a2b3; text-decoration: line-through; }
  .opt input:disabled + span small { text-decoration: none; color: var(--bad); }
  .opt .full small { color: var(--bad); }

  .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .alert { padding: 12px 14px; border-radius: 10px; margin-top: 16px; font-size: 14px; }
  .alert.err { background: var(--bad-soft); color: #b42318; }
  .alert.ok { background: var(--ok-soft); color: #067647; }

  .empty { text-align: center; padding: 18px 8px; }
  .empty .ic { font-size: 44px; }

  .table-wrap { overflow-x: auto; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .4px; }
  td button { background: none; border: 0; color: var(--bad); cursor: pointer; font: inherit; font-size: 13px; }

  .grid-map { display: grid; grid-template-columns: 70px repeat(5, 1fr); gap: 6px; font-size: 12.5px; margin-top: 8px; }
  .grid-map div { padding: 7px 4px; text-align: center; border-radius: 8px; background: #f8f9fb; }
  .grid-map .h { background: none; color: var(--muted); font-weight: 600; }
  .grid-map .s0 { background: var(--ok-soft); color: #067647; }
  .grid-map .s1 { background: #fff4e5; color: #b54708; }
  .grid-map .s2 { background: var(--bad-soft); color: #b42318; }

  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .pill { padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: #eef2f6; color: var(--muted); }
  .pill.admin { background: #fdf2fa; color: #c11574; }
  .link { background: none; border: 0; color: var(--primary); font: inherit; font-weight: 600; cursor: pointer; padding: 0; }

  @media (max-width: 480px) {
    .opts.c5 { grid-template-columns: repeat(3, 1fr); }
    .roles { grid-template-columns: 1fr; }
    .card { padding: 18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🚗</div>
    <h1>ĐẶT XE THỰC HÀNH</h1>
    <p>Đăng kí lịch tập xe sa hình</p>
  </header>
  <main id="app"></main>
</div>

<script>
const app = document.getElementById('app');
let state = null;          // { date, hang, xe, times, taken }
let role = null;           // 'admin' | 'guest'
let token = sessionStorage.getItem('adminToken');
let flash = null;          // { type, text }

const SLOT = { '6H -7H': ['6-7'], '7H -8H': ['7-8'], 'CẢ 2 GIỜ': ['6-7', '7-8'] };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = (d) => d ? d.split('-').reverse().join('/') : '';
const weekday = (d) => ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'][new Date(d + 'T00:00').getDay()];
const taken = (hang, xe) => (state.taken[`${hang}|${xe}`] || []);

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers.Authorization = 'Bearer ' + token;
  const r = await fetch(path, { ...opts, headers, body: opts.body && JSON.stringify(opts.body) });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && role === 'admin' && path !== '/api/admin/login') { logout(); }
  if (!r.ok) throw Object.assign(new Error(data.error || 'Có lỗi xảy ra'), { data });
  return data;
}
async function refresh() { state = await api('/api/state'); }

function alertHtml() {
  if (!flash) return '';
  const h = `<div class="alert ${flash.type}">${esc(flash.text)}</div>`;
  flash = null;
  return h;
}
function topbar() {
  return `<div class="topbar">
    <span class="pill ${role === 'admin' ? 'admin' : ''}">${role === 'admin' ? '🔐 Admin' : '👤 Khách'}</span>
    <span class="spacer"></span>
    <button class="link" onclick="logout()">Đổi vai trò</button>
  </div>`;
}

// ---------- Màn hình chọn vai trò ----------
function viewRoles() {
  app.innerHTML = `<div class="card">
    <h2>Bạn là ai?</h2>
    <p class="sub">Chọn vai trò để tiếp tục</p>
    <div class="roles">
      <button class="role" onclick="pickAdmin()"><div class="ic">🛡️</div><b>Admin</b><span>Chọn ngày đăng kí, quản lý lịch</span></button>
      <button class="role" onclick="pickGuest()"><div class="ic">🙋</div><b>Khách</b><span>Đặt xe tập sa hình</span></button>
    </div>
  </div>`;
}
function pickGuest() { role = 'guest'; viewForm(); }
function pickAdmin() {
  if (token) { role = 'admin'; return viewAdmin(); }
  app.innerHTML = `<div class="card">
    <h2>Đăng nhập Admin</h2>
    <p class="sub">Nhập mật khẩu quản trị</p>
    <form id="f">
      <label class="f" for="pw">Mật khẩu</label>
      <input type="password" id="pw" autocomplete="current-password" autofocus>
      ${alertHtml()}
      <div class="row" style="margin-top:20px">
        <button type="button" class="btn ghost" onclick="viewRoles()">← Quay lại</button>
        <span class="spacer"></span>
        <button class="btn">Đăng nhập</button>
      </div>
    </form>
  </div>`;
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    try {
      const r = await api('/api/admin/login', { method: 'POST', body: { password: pw.value } });
      token = r.token; sessionStorage.setItem('adminToken', token); role = 'admin';
      viewAdmin();
    } catch (err) { flash = { type: 'err', text: err.message }; pickAdmin(); }
  };
}
function logout() {
  token = null; role = null; sessionStorage.removeItem('adminToken');
  viewRoles();
}

// ---------- Admin ----------
let editingDate = false;
async function viewAdmin() {
  await refresh();
  if (!state.date) editingDate = true;
  const dateBlock = editingDate
    ? `<form id="df">
        <label class="f" for="d">Ngày đăng kí tập xe <span class="req">*</span></label>
        <input type="date" id="d" value="${state.date || ''}" required>
        <div class="row" style="margin-top:14px">
          ${state.date ? '<button type="button" class="btn ghost" onclick="editingDate=false;viewAdmin()">Huỷ</button>' : ''}
          <span class="spacer"></span>
          <button class="btn">💾 Lưu ngày</button>
        </div>
      </form>`
    : `<div class="date-banner"><div>📅</div><div><small>Ngày đăng kí hiện tại</small>
         <div class="big">${weekday(state.date)}, ${fmtDate(state.date)}</div></div>
         <span class="spacer"></span>
         <button class="btn" onclick="editingDate=true;viewAdmin()">Đổi ngày</button></div>`;

  let list = '';
  if (state.date) {
    const { bookings } = await api('/api/admin/bookings');
    list = `<div class="card">
      <div class="row"><h2>Lịch đã đặt</h2><span class="spacer"></span><span class="pill">${bookings.length} lượt</span></div>
      ${mapHtml()}
      ${bookings.length ? `<div class="table-wrap"><table>
        <tr><th>Hạng</th><th>Xe</th><th>Giờ</th><th>Học viên</th><th>Thầy</th><th></th></tr>
        ${bookings.map((b) => `<tr><td>${esc(b.hang)}</td><td>${esc(b.xe)}</td><td>${esc(b.time)}</td>
          <td>${esc(b.student)}</td><td>${esc(b.teacher)}</td>
          <td><button onclick="removeBooking('${b.id}')" title="Chỉ xoá trên web để giải phóng khung giờ">Xoá</button></td></tr>`).join('')}
      </table></div>` : '<p class="hint">Chưa có ai đặt xe cho ngày này.</p>'}
    </div>`;
  }

  app.innerHTML = `${topbar()}
    <div class="card">
      <h2>Quản lý ngày đăng kí</h2>
      <p class="sub">Khách chỉ đặt xe được khi đã có ngày đăng kí.</p>
      ${dateBlock}
      ${alertHtml()}
      ${state.date && !editingDate ? '<button class="btn block" onclick="viewForm()">📝 Mở form đặt xe</button>' : ''}
    </div>
    ${list}`;

  const df = document.getElementById('df');
  if (df) df.onsubmit = async (e) => {
    e.preventDefault();
    try {
      await api('/api/admin/date', { method: 'POST', body: { date: d.value } });
      editingDate = false; flash = { type: 'ok', text: 'Đã cập nhật ngày đăng kí.' };
    } catch (err) { flash = { type: 'err', text: err.message }; }
    viewAdmin();
  };
}
async function removeBooking(id) {
  await api('/api/admin/bookings/' + encodeURIComponent(id), { method: 'DELETE' });
  flash = { type: 'ok', text: 'Đã xoá lượt đặt (dữ liệu đã gửi lên Google Form vẫn giữ nguyên).' };
  viewAdmin();
}
function mapHtml() {
  const cell = (h, x) => { const n = taken(h, x).length; return `<div class="s${n}">${n === 0 ? 'Trống' : n === 1 ? '1/2' : 'Đầy'}</div>`; };
  return `<div class="grid-map">
    <div class="h"></div>${state.xe.map((x) => `<div class="h">${x}</div>`).join('')}
    ${state.hang.map((h) => `<div class="h">${h}</div>${state.xe.map((x) => cell(h, x)).join('')}`).join('')}
  </div>`;
}

// ---------- Form đặt xe ----------
const form = { teacher: '', hang: '', xe: '', time: '', student: '' };

async function viewForm() {
  await refresh();
  const back = role === 'admin' ? '<button class="btn ghost" onclick="viewAdmin()">← Về trang admin</button>' : '';

  if (!state.date) {
    app.innerHTML = `${topbar()}<div class="card empty">
      <div class="ic">⏳</div>
      <h2>Chưa mở đăng kí</h2>
      <p class="sub">Admin chưa chọn ngày đăng kí tập xe. Vui lòng quay lại sau.</p>
      <button class="btn" onclick="viewForm()">↻ Tải lại</button>
    </div>`;
    return;
  }

  // Bỏ lựa chọn không còn hợp lệ sau khi dữ liệu thay đổi
  if (form.xe && form.hang && taken(form.hang, form.xe).length >= 2) form.xe = '';
  if (form.time && (!form.xe || SLOT[form.time].some((s) => taken(form.hang, form.xe).includes(s)))) form.time = '';

  const radios = (name, values, label, disabledFn) => values.map((v) => {
    const dis = disabledFn ? disabledFn(v) : '';
    return `<label class="opt"><input type="radio" name="${name}" value="${esc(v)}" ${form[name] === v ? 'checked' : ''} ${dis ? 'disabled' : ''}>
      <span>${esc(v)}${label ? `<small>${label(v, dis)}</small>` : ''}</span></label>`;
  }).join('');

  const xeLabel = (x) => {
    if (!form.hang) return '&nbsp;';
    const n = taken(form.hang, x).length;
    return n === 0 ? 'Còn 2 giờ' : n === 1 ? 'Còn 1 giờ' : 'Hết chỗ';
  };
  const timeDisabled = (t) => !form.xe || SLOT[t].some((s) => taken(form.hang, form.xe).includes(s));
  const timeLabel = (t, dis) => !form.xe ? 'Chọn xe trước' : dis ? 'Đã có người đặt' : 'Còn trống';

  app.innerHTML = `${topbar()}
    <div class="card">
      <div class="date-banner"><div>📅</div><div><small>Ngày đăng kí tập xe</small>
        <div class="big">${weekday(state.date)}, ${fmtDate(state.date)}</div></div></div>

      <form id="bf" novalidate>
        <label class="f" for="teacher">Tên thầy <span class="req">*</span></label>
        <input type="text" id="teacher" name="teacher" value="${esc(form.teacher)}" placeholder="Nhập tên thầy hướng dẫn">

        <label class="f">Hạng xe <span class="req">*</span></label>
        <div class="opts c3">${radios('hang', state.hang)}</div>

        <label class="f">Xe <span class="req">*</span></label>
        <div class="opts c5">${radios('xe', state.xe, xeLabel, (x) => !form.hang || taken(form.hang, x).length >= 2)}</div>
        ${!form.hang ? '<div class="hint">Chọn hạng xe để xem xe còn trống.</div>' : ''}

        <label class="f">Thời gian <span class="req">*</span></label>
        <div class="opts c3">${radios('time', state.times, timeLabel, timeDisabled)}</div>
        <div class="hint">Mỗi xe có 2 khung giờ (6H–7H, 7H–8H). Mỗi khung giờ chỉ 1 người đặt.</div>

        <label class="f" for="student">Tên học viên <span class="req">*</span></label>
        <input type="text" id="student" name="student" value="${esc(form.student)}" placeholder="Nhập họ tên học viên">

        ${alertHtml()}
        <button class="btn block" id="sb">Gửi đăng kí</button>
        ${back ? `<div class="row" style="margin-top:12px">${back}</div>` : ''}
      </form>
    </div>`;

  const bf = document.getElementById('bf');
  bf.addEventListener('input', (e) => { if (e.target.type === 'text') form[e.target.name] = e.target.value; });
  bf.addEventListener('change', (e) => {
    if (e.target.type !== 'radio') return;
    form[e.target.name] = e.target.value;
    if (e.target.name === 'hang') { form.xe = ''; form.time = ''; }
    if (e.target.name === 'xe') form.time = '';
    viewForm();
  });
  bf.onsubmit = submitForm;
}

async function submitForm(e) {
  e.preventDefault();
  const missing = [];
  if (!form.teacher.trim()) missing.push('tên thầy');
  if (!form.hang) missing.push('hạng xe');
  if (!form.xe) missing.push('xe');
  if (!form.time) missing.push('thời gian');
  if (!form.student.trim()) missing.push('tên học viên');
  if (missing.length) { flash = { type: 'err', text: 'Vui lòng nhập/chọn: ' + missing.join(', ') + '.' }; return viewForm(); }

  const sb = document.getElementById('sb');
  sb.disabled = true; sb.textContent = 'Đang gửi...';
  try {
    const r = await api('/api/submit', { method: 'POST', body: form });
    viewSuccess(r.booking);
  } catch (err) {
    flash = { type: 'err', text: err.message };
    viewForm();
  }
}

function viewSuccess(b) {
  app.innerHTML = `<div class="card empty">
    <div class="ic">✅</div>
    <h2>Đăng kí thành công!</h2>
    <p class="sub">Thông tin đã được gửi lên Google Form.</p>
    <div class="table-wrap"><table style="max-width:380px;margin:0 auto 20px">
      <tr><th>Ngày</th><td>${fmtDate(b.date)}</td></tr>
      <tr><th>Tên thầy</th><td>${esc(b.teacher)}</td></tr>
      <tr><th>Hạng xe</th><td>${esc(b.hang)}</td></tr>
      <tr><th>Xe</th><td>${esc(b.xe)}</td></tr>
      <tr><th>Thời gian</th><td>${esc(b.time)}</td></tr>
      <tr><th>Học viên</th><td>${esc(b.student)}</td></tr>
    </table></div>
    <div class="row" style="justify-content:center">
      <button class="btn" onclick="form.xe='';form.time='';form.student='';viewForm()">Đăng kí thêm</button>
      ${role === 'admin' ? '<button class="btn ghost" onclick="viewAdmin()">Về trang admin</button>' : ''}
    </div>
  </div>`;
}

viewRoles();
</script>
</body>
</html>
